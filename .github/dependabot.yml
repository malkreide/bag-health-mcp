version: 2
updates:
  # Python runtime + dev dependencies declared in pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
    # The `mcp` SDK governs the negotiated MCP protocol version, so major
    # bumps are reviewed deliberately rather than auto-grouped/merged.
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  # Pinned action versions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
