name: Live API tests

# Die Unit-Tests laufen gegen aufgezeichnete Fixtures. Eine Fixture belegt die
# Form einer Antwort zu ihrem Aufnahmedatum — nicht, dass die Quelle heute noch
# so antwortet. Wechselt BAG oder Obsan eine Schreibweise, bleibt die gesamte
# CI gruen und der Server ist produktiv kaputt. Dieser Lauf ist die einzige
# Stelle, an der das auffaellt, bevor es jemand meldet (Audit-Katalog:
# DRIFT-005).

on:
  schedule:
    # Taeglich 06:17 UTC. Die Quelldaten sind wochenweise, taeglich reicht also
    # weit; die schiefe Minute haelt den Lauf aus der vollen Stunde heraus, in
    # der GitHub Scheduled Jobs verzoegert.
    - cron: "17 6 * * *"
  workflow_dispatch:

# GitHub deaktiviert Scheduled Workflows nach 60 Tagen ohne Repo-Aktivitaet.
# Bleibt das Repo laenger still, muss der Workflow von Hand reaktiviert werden.

concurrency:
  group: live-tests
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      # Eine Version genuegt: geprueft wird die Quelle, nicht der Interpreter —
      # und eine Matrix vervielfachte die Last auf einer oeffentlichen API.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Kein Retry: ein Retry verdeckt genau den Fall, fuer den dieser Lauf da
      # ist. Eine einzelne Netzstoerung oeffnet ein Issue, das der naechste
      # gruene Lauf selbst wieder schliesst.
      #
      # `continue-on-error`, damit die Einordnung in jedem Fall laeuft. Rot
      # wird der Job weiter unten, aus dem eingeordneten Ergebnis.
      - name: Run live tests
        id: suite
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=src pytest tests/ -m live --timeout=30 \
            --junitxml=live-report.xml 2>&1 | tee live-output.txt
          echo "pytest_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # `if: failure()` kennt rot und nicht rot. Ein Live-Lauf hat drei
      # Antworten, und die dritte zaehlt: Ein gescheitertes `pip install`, ein
      # Timeout oder eine umbenannte Marke sind NICHT dasselbe wie ein
      # gebrochener Vertrag mit BAG oder Obsan. Und ein Lauf, in dem jeder Test
      # uebersprungen wurde, sieht unter jedem Exit-Code-Check aus wie Erfolg —
      # der Schritt weiter unten haette ein offenes Issue geschlossen, ohne
      # dass irgendetwas verglichen worden waere.
      - name: Ergebnis einordnen
        id: verdict
        env:
          PYTEST_EXIT: ${{ steps.suite.outputs.pytest_exit }}
        run: |
          args=(live-report.xml)
          if [ -n "$PYTEST_EXIT" ]; then
            args+=(--pytest-exit "$PYTEST_EXIT")
          fi
          python scripts/classify_live_run.py "${args[@]}"

      - name: Open or update the failure issue
        if: steps.verdict.outputs.state == 'finding'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create live-failure --force \
            --color B60205 --description "Live-Tests gegen die Quelle sind rot"
          EXISTING=$(gh issue list --state open --label live-failure \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Weiterhin rot: $RUN_URL"
          else
            {
              printf 'Der geplante Live-Lauf ist fehlgeschlagen: %s\n\n' "$RUN_URL"
              printf 'Erst die Quelle abfragen, dann einordnen — nicht aus der\n'
              printf 'Fehlermeldung schliessen. "Nicht gefunden" hiess hier schon\n'
              printf 'einmal nicht, dass der Datensatz weg war, sondern dass die\n'
              printf 'Quelle die Schreibweise ihrer Kopfzeile gewechselt hatte.\n\n'
              printf 'Haelt die Aenderung, gehoeren die Fixtures neu aufgezeichnet\n'
              printf '(scripts/record_fixtures.py).\n\n'
              printf 'Dieses Issue schliesst sich beim naechsten gruenen Lauf selbst.\n'
            } > /tmp/live-failure-body.md
            gh issue create --label live-failure \
              --title "Live-Tests gegen die Quelle sind rot" \
              --body-file /tmp/live-failure-body.md
          fi

      # Ein Issue, das nach der Reparatur offen bleibt, wird zum Rauschen und
      # damit ignoriert — dann ist der Workflow so wirkungslos wie keiner.
      # Nur bei `clear`. `unknown` laesst den Thread in Ruhe: Ein Lauf, der
      # nichts gemessen hat, darf kein Issue schliessen — der Vergleich, auf
      # den sich das Schliessen beruft, hat nicht stattgefunden.
      - name: Close the failure issue once green again
        if: steps.verdict.outputs.state == 'clear'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for N in $(gh issue list --state open --label live-failure \
            --json number --jq '.[].number'); do
            gh issue close "$N" --comment "Live-Tests wieder gruen: $RUN_URL"
          done

      # Erst hier wird der Job rot. `clear` ist gruen; `finding` und `unknown`
      # sind beide rot, aber nur `finding` hat oben ein Issue erzeugt — der
      # Unterschied steht im Log, nicht im Exit-Code.
      #
      # Ueber `env`, nicht ueber `${{ }}` im Skript: Der Grund kann eine
      # Parser-Meldung ueber eine fremde Datei enthalten, und `${{ }}` setzt sie
      # vor dem Start woertlich in die Shell ein.
      - name: Ergebnis durchreichen
        if: steps.verdict.outputs.state != 'clear'
        env:
          LIVE_STATE: ${{ steps.verdict.outputs.state }}
          LIVE_REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          echo "Live-Suite: $LIVE_STATE"
          echo "$LIVE_REASON"
          exit 1
