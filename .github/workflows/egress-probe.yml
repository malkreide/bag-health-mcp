name: TEMP egress probe

# Wegwerf-Diagnose, nicht zum Mergen gedacht — wird nach der Auswertung entfernt.
#
# Runde 1 hat gezeigt: der Runner erreicht beide Quellen einwandfrei
# (TCP-Connect 0.16s/0.31s, curl http=404/200). Das Netz ist also nicht die
# Ursache der sechs roten Live-Tests aus Issue #61.
#
# Runde 2 fuehrt deshalb den Egress-Pfad des Servers selbst aus — denselben
# httpx-Client mit _PinningBackend, den die Tools benutzen — und zeigt den
# vollen Traceback, statt aus der Fehlermeldung zu schliessen.

on:
  pull_request:
    paths:
      - ".github/workflows/egress-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Der Client des Servers, direkt
        run: |
          PYTHONPATH=src python - <<'PY'
          import asyncio, traceback
          from bag_health_mcp import server as srv

          async def main():
              print("IDD_BASE :", srv.IDD_BASE)
              print("TIMEOUT  :", srv.TIMEOUT)
              print("USER_AGENT:", srv.USER_AGENT)
              client = srv._new_client()
              for path in ("/", "/api/v1/topics"):
                  try:
                      r = await asyncio.wait_for(client.get(path), timeout=25)
                      print(f"GET {path!r} -> {r.status_code}, {len(r.content)} bytes")
                  except Exception:
                      print(f"GET {path!r} -> FEHLER:")
                      traceback.print_exc()
              await client.aclose()

          asyncio.run(main())
          PY

      - name: Aufloesung wie der Pinning-Backend sie sieht
        run: |
          PYTHONPATH=src python - <<'PY'
          import asyncio, traceback
          from bag_health_mcp import server as srv
          async def main():
              for h in ("api.idd.bag.admin.ch", "ind.obsan.admin.ch"):
                  try:
                      print(h, "->", await srv._resolve_host(h))
                  except Exception:
                      traceback.print_exc()
          asyncio.run(main())
          PY

      - name: Ein Live-Test mit vollem Traceback
        run: |
          PYTHONPATH=src pytest tests/test_server.py::test_live_data_version \
            -m live --timeout=60 --tb=long -q || true

      - name: Netz-Gegenprobe (Runde 1 wiederholt)
        run: |
          curl -sS -o /dev/null --max-time 20 \
            -w "idd http=%{http_code} total=%{time_total}s\n" \
            https://api.idd.bag.admin.ch || echo "curl exit=$?"
