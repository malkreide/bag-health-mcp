name: TEMP egress probe

# Wegwerf-Diagnose, nicht zum Mergen gedacht.
#
# Der erste live.yml-Lauf ist mit sechs von sechs Tests auf Verbindungsebene
# gescheitert (Issue #61), waehrend dieselben Tests ausserhalb der Runner gruen
# liefen und beide Hosts antworteten. Diese Datei misst runner-seitig, wo genau
# es klemmt. Sie wird nach der Auswertung wieder entfernt.

on:
  pull_request:
    paths:
      - ".github/workflows/egress-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wer sind wir nach aussen
        run: |
          curl -sS --max-time 20 https://api.ipify.org || echo "(ipify nicht erreichbar)"
          echo

      - name: DNS-Aufloesung der beiden Quellen
        run: |
          python3 - <<'PY'
          import socket
          for h in ("api.idd.bag.admin.ch", "ind.obsan.admin.ch"):
              try:
                  infos = socket.getaddrinfo(h, None, proto=socket.IPPROTO_TCP)
                  for fam, *_ , sa in infos:
                      print(f"{h}: {'v6' if fam==socket.AF_INET6 else 'v4'}  {sa[0]}")
              except OSError as exc:
                  print(f"{h}: DNS FEHLER {exc!r}")
          PY

      - name: Nackter TCP-Connect auf :443
        run: |
          python3 - <<'PY'
          import socket, time
          for h in ("api.idd.bag.admin.ch", "ind.obsan.admin.ch"):
              t0 = time.time()
              try:
                  s = socket.create_connection((h, 443), timeout=15)
                  s.close()
                  print(f"{h}:443  CONNECT OK  {time.time()-t0:.2f}s")
              except Exception as exc:
                  print(f"{h}:443  CONNECT FEHLER nach {time.time()-t0:.2f}s: {exc!r}")
          PY

      - name: curl mit Timing
        run: |
          for U in https://api.idd.bag.admin.ch https://ind.obsan.admin.ch; do
            echo "--- $U"
            curl -sS -o /dev/null --max-time 25 \
              -w "http=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n" \
              "$U" || echo "curl exit=$?"
          done

      - name: Gegenprobe an einem unbeteiligten Host
        run: |
          curl -sS -o /dev/null --max-time 20 \
            -w "example.com http=%{http_code} total=%{time_total}s\n" https://example.com \
            || echo "curl exit=$?"
