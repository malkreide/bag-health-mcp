[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "bag-health-mcp"
version     = "0.3.0"
description = "MCP server for Swiss Federal Office of Public Health (BAG) infectious disease surveillance — IDD API"
readme      = "README.md"
license     = { file = "LICENSE" }
requires-python = ">=3.11"

keywords = [
    "mcp", "model-context-protocol", "swiss-open-data",
    "bag", "bundesamt-gesundheit", "infectious-diseases", "surveillance",
    "public-health", "switzerland", "idd", "influenza", "covid19", "epidemiology",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Upper bounds pin the supply chain against breaking major releases.
# The `mcp` SDK pin also governs the advertised MCP protocol revision;
# MCPServer exposes no separate protocol-version setting, so the SDK range is
# the pin point. Verified on mcp 2.0.0: the `initialize` handshake still caps at
# 2025-11-25 (unchanged from 1.x), and the added 2026-07-28 revision is reachable
# only over the SDK's separate "modern" path. The floor is 2.0.0,
# not a wider range: the server API moved from `mcp.server.fastmcp` to
# `mcp.server.mcpserver` in 2.0.0 with no compatibility shim, so this package
# cannot import under 1.x. A future `mcp` 3.x may shift the revision again and
# is excluded here, to be rolled forward deliberately (tracked via Dependabot).
dependencies = [
    "mcp[cli]>=2.0.0,<3",
    "httpx>=0.27.0,<1",
    # Imported directly for the SEC-005 outbound DNS-pinning network backend
    # (httpx's transport layer; httpx already depends on httpcore).
    "httpcore>=1.0.0,<2",
    "pydantic>=2.0.0,<3",
    # Imported directly for the Settings config object (ARCH-004); already a
    # transitive dependency of mcp.
    "pydantic-settings>=2.0,<3",
]

[project.optional-dependencies]
# Optional OpenTelemetry tracing (OBS-006). Tracing is a no-op unless these are
# installed AND an OTEL endpoint is configured, so the base install stays lean.
telemetry = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "opentelemetry-instrumentation-httpx>=0.40b0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    # Per-Test-Timeout fuer die Live-Tests (.github/workflows/live.yml). Ohne
    # das Plugin bricht der dokumentierte Befehl `pytest -m live --timeout=30`
    # mit "unrecognized arguments" ab, und ein haengender Endpunkt blockiert
    # den Lauf bis zum Job-Limit.
    "pytest-timeout>=2.3.0",
    "respx>=0.21.0",
    # Exact pin, mirroring the pinned install in .github/workflows/ci.yml. An
    # open range would lint local work with a different rule set than CI, which
    # reports diffs nobody caused. Roll both forward together.
    "ruff==0.16.1",
    # so the tracing-active path can be exercised offline in tests
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "opentelemetry-instrumentation-httpx>=0.40b0",
]

[project.scripts]
bag-health-mcp = "bag_health_mcp.server:main"

[project.urls]
Homepage   = "https://github.com/malkreide/bag-health-mcp"
Repository = "https://github.com/malkreide/bag-health-mcp"
Issues     = "https://github.com/malkreide/bag-health-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bag_health_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "-v --tb=short"
markers      = [
    "live: live API tests (skipped in CI by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
