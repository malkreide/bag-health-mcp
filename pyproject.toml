[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "bag-health-mcp"
version     = "0.2.2"
description = "MCP server for Swiss Federal Office of Public Health (BAG) infectious disease surveillance — IDD API"
readme      = "README.md"
license     = { file = "LICENSE" }
requires-python = ">=3.11"

keywords = [
    "mcp", "model-context-protocol", "swiss-open-data",
    "bag", "bundesamt-gesundheit", "infectious-diseases", "surveillance",
    "public-health", "switzerland", "idd", "influenza", "covid19", "epidemiology",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Upper bounds pin the supply chain against breaking major releases.
# The `mcp` SDK pin also governs the advertised MCP protocol revision
# (verified: mcp 1.27.x advertises 2025-11-25); FastMCP exposes no separate
# protocol-version setting, so the SDK range is the pin point. A future
# `mcp` 2.x may advertise a different revision, so it is excluded here and
# rolled forward deliberately (tracked via Dependabot) rather than silently.
dependencies = [
    "mcp[cli]>=1.27.0,<2",
    "httpx>=0.27.0,<1",
    # Imported directly for the SEC-005 outbound DNS-pinning network backend
    # (httpx's transport layer; httpx already depends on httpcore).
    "httpcore>=1.0.0,<2",
    "pydantic>=2.0.0,<3",
    # Imported directly for the Settings config object (ARCH-004); already a
    # transitive dependency of mcp.
    "pydantic-settings>=2.0,<3",
]

[project.optional-dependencies]
# Optional OpenTelemetry tracing (OBS-006). Tracing is a no-op unless these are
# installed AND an OTEL endpoint is configured, so the base install stays lean.
telemetry = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "opentelemetry-instrumentation-httpx>=0.40b0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    # so the tracing-active path can be exercised offline in tests
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "opentelemetry-instrumentation-httpx>=0.40b0",
]

[project.scripts]
bag-health-mcp = "bag_health_mcp.server:main"

[project.urls]
"mcp-name" = "io.github.malkreide/bag-health-mcp"
Homepage   = "https://github.com/malkreide/bag-health-mcp"
Repository = "https://github.com/malkreide/bag-health-mcp"
Issues     = "https://github.com/malkreide/bag-health-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bag_health_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "-v --tb=short"
markers      = [
    "live: live API tests (skipped in CI by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
