<html><body><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"texts":{"intro":"\u003cp\u003eIn der Schweiz sterben jeden Tag zwei bis drei Menschen durch Suizid; dies ohne die Fälle von Suizidhilfe. Suizide haben häufig einen Zusammenhang mit psychischen Krankheiten wie z.B. Depression oder Alkoholkrankheit. Sie erfolgen oft in einem psychischen Ausnahmezustand, in welchem die Fähigkeit, mit belastenden Situationen umzugehen, massgeblich eingeschränkt ist (WHO, 2019). Suizide gehören nach Krebs- und Kreislauferkrankungen zu den häufigsten Gründen für eine frühzeitige Sterblichkeit einer Bevölkerung, dies gemessen in verlorenen potenziellen Lebensjahren. Auch haben Suizide beträchtliche Folgen für Angehörige und Nahestehende.\u003c/p\u003e\n\n\u003cp\u003eGemäss den medizin-ethischen Richtlinien der Schweizerischen Akademie der Medizinischen Wissenschaften (SAMW) zählen zur Suizidhilfe - analoge Begriffe sind «assistierter Suizid» oder «Beihilfe zu Suizid» - «\u003cem\u003eHandlungen, die in der Absicht erfolgen, einer urteilsfähigen Person die Durchführung des Suizids zu ermöglichen, insbesondere die Verschreibung oder Aushändigung eines Medikamentes zum Zweck der Selbsttötung\u003c/em\u003e» (SAMW, 2018/2021, S. 25). Suizidhilfe erfolgt häufig als Reaktion auf chronische körperliche Erkrankungen, die mit zunehmendem Alter häufiger auftreten. Beispiele hierfür sind Krebserkrankungen, Herz-Kreislauf-Erkrankungen oder Krankheiten des Nervensystems (BFS, 2020).\u003c/p\u003e\n","resultat":"\u003ch3\u003eSuizidgedanken? Holen Sie sich Hilfe!\u003c/h3\u003e\u003cp\u003e\u003ca href=\"http://www.npg-rsp.ch/de/metanav/an-betroffene-angehoerige-hilfe-suchende.html\"\u003eAdressen\u0026nbsp;für Betroffene, Angehörige, Hilfesuchende\u003c/a\u003e (Webseite Netzwerk Psychische Gesundheit)\u003c/p\u003e","definition":"\u003cp\u003eStandardisierte Suizidrate (Todesursachen nach ICD-10 Codes X60 bis X84) pro 100 000 Einwohner/innen.\u003c/p\u003e\n\n\u003cp\u003eDie Suizidhilferate ist als Todesursache nach ICD-10 Code X618 definiert.\u003c/p\u003e\n\n\u003cp\u003eDie hier dargestellten Ergebnisse basieren auf der Todesursachenstatistik des BFS; berücksichtigt werden verstorbene Personen mit vormaligem Wohnsitz in der Schweiz.\u003c/p\u003e\n\n\u003ch4\u003eStandardisierung\u003c/h4\u003e\n\n\u003cp\u003eDie standardisierte Rate wurde anhand der direkten Methode mit der europäischen Standardbevölkerung 2010 berechnet und ist hier beschrieben:\u0026nbsp;\u003ca href=\"https://www.obsan.admin.ch/de/standardisierung-erklaerung-und-berechnung\"\u003eStandardisierung - Erklärung und Berechnung\u003c/a\u003e.\u003c/p\u003e\n","source":"\u003cul\u003e\n\u003cli\u003eBundesamt für Statistik (BFS): \u003ca href='https://www.bfs.admin.ch/bfs/de/home/statistiken/gesundheit/erhebungen/ecod.html' target='_blank'\u003eStatistik der Todesursachen\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eBundesamt für Statistik (BFS): \u003ca href='https://www.bfs.admin.ch/bfs/de/home/statistiken/bevoelkerung/erhebungen/statpop.html' target='_blank'\u003eStatistik der Bevölkerung und der Haushalte (STATPOP)\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","referenzen":"\u003cul\u003e\n\t\u003cli\u003eBFS (2020). \u003cem\u003eTodesursachenstatistik 2018: H\u0026auml;ufigste Todesursachen bleiben im Jahr 2018 stabil - assistierter Suizid nimmt stark zu.\u003c/em\u003e\u0026nbsp;Neuch\u0026acirc;tel: Bundesamt f\u0026uuml;r Statistik.\u003c/li\u003e\n\t\u003cli\u003eSAMW (2018, angepasst 2021).\u003cem\u003e Medizin-ethische Richtlinien: Umgang mit Sterben und Tod.\u003c/em\u003e\u0026nbsp;Bern: Schweizerische Akademie der Medizinischen Wissenschaften.\u003c/li\u003e\n\t\u003cli\u003eWHO (2019). \u003cem\u003e\u003ca href=\"https://www.who.int/news-room/fact-sheets/detail/suicide\"\u003eSuicide Fact sheet\u003c/a\u003e\u003c/em\u003e.\u0026nbsp;World Health Organization.\u003c/li\u003e\n\u003c/ul\u003e\n","lastUpdated":"22.12.2025","definition_headi
