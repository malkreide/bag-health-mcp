<html><body><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"texts":{"intro":"\u003cp\u003eDer Lebenserwartung oder Langlebigkeit einer Bevölkerung können verschiedenen gesundheitsrelevanten Faktoren zugeschrieben werden; zu nennen sind dabei etwa die sozioökonomische und umweltbezogene Situation, gesellschaftliche Regeln und Lebensstile sowie individuelle Faktoren. Es handelt sich bei der Lebenserwartung um einen breit anerkannten und gut verfügbaren Indikator, der Vergleiche zwischen Regionen und Ländern erlaubt.\u003c/p\u003e\n","resultat":"","definition":"\u003cp\u003eDurchschnittliche Lebenszeit einer Bevölkerung; für jede Altersklasse wird dabei angenommen, dass sich die künftige Mortalität gemäss der Bedingungen zum Zeitpunkt der Berechnung verhalten wird.\u003c/p\u003e\n\n\u003ch4\u003eBerechnung dieses Indikators\u003c/h4\u003e\n\n\u003cp\u003eZuerst werden die altersspezifischen Sterberaten berechnet. Als Sterbewahrscheinlichkeiten pro Altersklasse werden diese anschliessend auf eine fiktive Kohorte von 100 000 Personen umgerechnet. Unter der Annahme, dass diese Kohorte den Sterbebedingungen zum Zeitpunkt der Berechnung ausgesetzt sein wird, kann man die Zahl der Überlebenden sowie der Todesfälle für jede Altersklasse bestimmen. Die durchschnittliche Lebenserwartung entspricht dann der mittleren Zahl der noch zu lebenden Jahre dieser fiktiven Kohorte. Sie wird für jedes Alter getrennt berechnet und kann daher als Lebenserwartung bei Geburt, oder auch – wie vorliegend – als Lebenserwartung im Alter von 65 Jahren dargestellt werden.\u003c/p\u003e\n\n\u003cp\u003eDie Lebenserwartung wurde nach der von Preston et al. (2000) beschriebenen Methode berechnet. Für die Sterblichkeit von Kindern unter fünf Jahren wurden die Berechnungen von Andrejew und Kingkade (2015) zugrunde gelegt. Schliesslich wurden die Konfidenzintervalle nach Chiang (1984) berechnet.\u003c/p\u003e\n","source":"\u003cul\u003e\n\u003cli\u003eBundesamt für Statistik (BFS): \u003ca href='https://www.bfs.admin.ch/bfs/de/home/statistiken/gesundheit/erhebungen/ecod.html' target='_blank'\u003eStatistik der Todesursachen\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eBundesamt für Statistik (BFS): \u003ca href='https://www.bfs.admin.ch/bfs/de/home/statistiken/bevoelkerung/erhebungen/statpop.html' target='_blank'\u003eStatistik der Bevölkerung und der Haushalte (STATPOP)\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","referenzen":"\u003cul\u003e\u003cli\u003ePreston S., Heuveline P., Guillot M. (2000).\u0026nbsp;\u003ci\u003eDemography: Measuring and Modeling Population Processes\u003c/i\u003e. Malden: Wiley-Blackwell.\u003c/li\u003e\u003cli\u003eChiang Ch. L. (1984).\u0026nbsp;\u003ci\u003eThe Life Table and its Applications\u003c/i\u003e. Malabar: Krieger Publishing Company.\u003c/li\u003e\u003cli\u003eAndreev E.M., Kingkade W. W. (2015).\u0026nbsp;\u003ci\u003eAverage age at death in infancy and infant mortality level: Reconsidering the Coale-Demeny formulas at current levels of low mortality\u003c/i\u003e.\u0026nbsp;Demographic Research 33.\u003c/li\u003e\u003c/ul\u003e","lastUpdated":"22.12.2025","definition_heading":"Definition","lastUpdated_heading":"Zuletzt aktualisiert","source_heading":"Quellen","referenzen_heading":"Referenzen","search_terms":"Lebenserwartung, Mortalität","info_heading":"Weiterführende Informationen"},"slug":"lebenserwartung","id":"_001","jsonLDs":{"links":{"od3":{"_001":{"kg":{"apiUrl":"https://ind.obsan.admin.ch/api/_001/kg/json"}}},"echo":{}},"schemas":[{"@context":"https://schema.org","@type":"Dataset","name":"Lebenserwartung, nach Kantonen","description":"Dieser Datensatz ist Teil des Indikatorensystems «Obsan-Indikatoren», des Indikators «Lebenserwartung» und des Diagrams «Lebenserwartung». Er zeigt folgende Daten: in Jahren, nach Kantonen.","creator":{"@type":"Organization","name":"Schweizerisches Gesundheitsobsevratorium (Obsan)","url":"https://www.obsan.admin.ch"},"includedInDataCatalog":{"@type":"DataCatalog","name":"Obsan-Indikatoren","url":"https://ind.obsan.admin.ch"},"spatialCoverage":{"@type":"Place","name":"Switzerland","address":{"@type":"PostalAddress","addressCountry":"CH"}},"temporalCoverage":"1998/2024","distribution":{"@type":"DataDownload","encodingFormat":"application/json","contentUrl":"https://ind.obsan.admin.ch/api/_001/kg/json"},"license":"https://www.bfs.admin.ch/bfs/en/home/fso/swiss-federal-statistical-office/terms-of-use.html","dateModified":"2025-12-22","version":"20251209"}]}},"__N_SSP":true},"page":"/indicator/[domain]/[id]","query":{"domain":"obsan","id":"lebenserwartung"},"buildId":"PmKueKgBfZ7BFOuRHrs5H","isFallback":false,"isExperimentalCompile":false,"gssp":true,"locale":"de","locales":["de","fr","it","en"],"defaultLocale":"de","scriptLoader":[]}</script></body></html>
